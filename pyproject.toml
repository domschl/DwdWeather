[project]
name = "dwdweather"
dynamic = ["version"]
description = "Modern DWD Weather Server and Dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "paho-mqtt>=2.0.0",
]

[project.scripts]
dwd-server = "dwd_server.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "dwd_server/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["dwd_server"]



